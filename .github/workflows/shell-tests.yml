name: Shell tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install br 0.5.2
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://raw.githubusercontent.com/Dicklesworthstone/beads_rust/main/install.sh" \
            | bash -s -- --dest "$HOME/.local/bin" --skip-skills --quiet --version v0.5.2
          br --version
          export BR052="$HOME/.local/bin/br"
          echo "BR052=$BR052" >> "$GITHUB_ENV"

      - name: Run test/*.sh
        run: |
          failed=0
          for f in test/*.sh; do
            echo "=== $f ==="
            if bash "$f"; then
              echo
            else
              failed=1
              echo "FAILED: $f" >&2
            fi
          done
          exit "$failed"
